function toast(message){const el=$("#toast");el.textContent=message;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2500)}
function showSystemDialog({title,message="",value="",input=true,confirmLabel="确定"}={}){const overlay=$("#systemDialog"),form=overlay.querySelector("form"),field=overlay.querySelector("[data-dialog-input]");overlay.querySelector("[data-dialog-title]").textContent=title;overlay.querySelector("[data-dialog-message]").textContent=message;overlay.querySelector("[data-dialog-submit]").textContent=confirmLabel;field.value=value;field.classList.toggle("hidden",!input);field.required=input;overlay.classList.add("open");overlay.setAttribute("aria-hidden","false");return new Promise(resolve=>{let complete=false;const finish=result=>{if(complete)return;complete=true;overlay.classList.remove("open");overlay.setAttribute("aria-hidden","true");form.removeEventListener("submit",submit);overlay.querySelector("[data-dialog-cancel]").removeEventListener("click",cancel);document.removeEventListener("keydown",escape);resolve(result)};const submit=e=>{e.preventDefault();finish(input?field.value:true)};const cancel=()=>finish(null);const escape=e=>{if(e.key==="Escape"){e.preventDefault();finish(null)}};form.addEventListener("submit",submit);overlay.querySelector("[data-dialog-cancel]").addEventListener("click",cancel);document.addEventListener("keydown",escape);if(input)setTimeout(()=>field.focus(),20);else overlay.querySelector("[data-dialog-submit]").focus()})}

function applySettings(){const wall=$(".wallpaper");const wallpapers={blue:"radial-gradient(ellipse 66% 74% at 60% 48%,#bbdcf8 0,#79b4e7 23%,transparent 62%),radial-gradient(ellipse 78% 80% at 35% 91%,#1368ae 0,#124b83 47%,transparent 75%),linear-gradient(145deg,#061e44 3%,#0a3a73 54%,#071d42 100%)",aurora:"radial-gradient(ellipse at 60% 45%,#54d3d0 0,transparent 47%),linear-gradient(145deg,#172458,#45358c 55%,#101d40)",sunset:"radial-gradient(ellipse at 64% 45%,#ffd596 0,transparent 42%),linear-gradient(145deg,#542b64,#c35560 58%,#381d50)"};document.body.dataset.wallpaper=settingsState.wallpaper;wall.style.background=wallpapers[settingsState.wallpaper]||wallpapers.blue;wall.style.filter=`brightness(${0.55+Number(settingsState.brightness)/160})`;document.body.classList.toggle("dark-mode",!!settingsState.darkMode);document.body.classList.toggle("high-contrast",!!settingsState.contrast);document.body.classList.toggle("night-light",!!settingsState.nightLight)}

if(page==="网络和 Internet")return `<div class="system-page"><h1>网络和 Internet</h1><p class="lead">网络连接状态与连接偏好（不连接真实网络）</p>${settingControl("Wi-Fi","Wi-Fi 模拟连接开关","wifi")}${settingControl("飞行模式","关闭所有模拟无线连接","airplane")}${settingTile("高级网络设置","网络适配器、数据使用情况","网络和 Internet")}<div class="settings-row">状态 <small>${settingsState.airplane?"飞行模式已开启":settingsState.wifi?"已连接 · 安全":"未连接"}</small></div></div>`;

if(page==="账户")return `<div class="system-page"><h1>账户</h1><p class="lead">管理此模拟桌面的本地个人资料</p><div class="settings-profile"><span class="profile-pic">用</span><div><b>${escapeHtml(settingsState.profileName)}</b><small style="display:block;color:#65707b;margin-top:4px">本地账户</small></div></div>${settingControl("用户名","此名称显示在开始菜单和设置中","profileName","text")}<button class="setting-action" data-save-profile>保存用户名</button><p class="lead" style="margin-top:16px">此账户不会连接 Microsoft 账号或任何在线服务。</p></div>`;

function settingsMarkup(){return `<div class="settings-layout"><nav class="settings-nav">${settingNames.map((n,i)=>`<button class="${i===0?"selected":""}" data-setting="${n}">${["⌂","▣","⌁","◉","◐","▦","◉","◷","♿","◇","↻"][i]}　${n}</button>`).join("")}</nav><div class="settings-main" data-settings-main>${settingsPageMarkup("主页")}</div></div>`}
function getNotes(){return notes}

function notepadMarkup(){const active=notes[0];return `<div class="note-layout"><div class="note-toolbar"><button data-note-action="new">＋ 新建</button><button data-note-action="save">保存</button><button data-note-action="download">另存为</button><button data-note-action="delete">删除</button><span class="note-title" style="margin-left:auto;font-size:11px;color:#69737e"></span></div><div class="note-tabbar">${notes.map((n,i)=>`<button class="note-tab ${i===0?"active":""}" data-note-id="${escapeHtml(n.id)}">${escapeHtml(n.name)}</button>`).join("")}</div><textarea class="note-editor" spellcheck="false" placeholder="开始键入内容...">${escapeHtml(active?.text||"")}</textarea><div class="note-status">字数：<span data-note-count>0</span>　·　已保存在此浏览器</div></div>`}

function raise(win){win.style.zIndex=++topZ}
function minimizeWindow(win){const task=document.querySelector(`[data-running="${CSS.escape(win.dataset.name)}"]`);win.classList.add("minimizing");if(task)task.classList.remove("active");setTimeout(()=>{if(win.isConnected){win.style.display="none";win.classList.remove("minimizing")}},160)}
function taskButtonFor(name,win){const existing=document.querySelector(`[data-running="${CSS.escape(name)}"]`);if(existing){existing.classList.add("active");return}const b=document.createElement("button");b.className="task-button running active";b.dataset.running=name;b.title=name;b.innerHTML=icon(findApp(name).kind,23);b.addEventListener("click",()=>{if(win.style.display!=="none"){minimizeWindow(win)}else{win.style.display="flex";win.classList.remove("minimized","minimizing");win.style.opacity="1";raise(win);b.classList.add("active")} });$("#runningApps").append(b)}

function openApp(name){if(name==="回收站"){toast("回收站为空");closePanels();return}closePanels();const existing=[...document.querySelectorAll(".window")].find(w=>w.dataset.name===name);if(existing){existing.style.display="flex";existing.classList.remove("minimized","minimizing");existing.style.opacity="1";raise(existing);document.querySelector(`[data-running="${CSS.escape(name)}"]`)?.classList.add("active");return existing}const data=findApp(name),win=document.createElement("section");win.className="window";win.dataset.name=name;win.style.zIndex=++topZ;win.innerHTML=`<header class="titlebar"><div class="window-label">${icon(data.kind,18)}<span>${name}</span></div><div class="window-controls"><button data-window="min" aria-label="最小化" title="最小化"><svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1"/></svg></button><button data-window="max" aria-label="最大化" title="最大化"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor"/></svg></button><button class="close" data-window="close" aria-label="关闭" title="关闭"><svg viewBox="0 0 12 12"><path d="m3 3 6 6m0-6L3 9" stroke="currentColor" stroke-width="1.2"/></svg></button></div></header><div class="window-content">${appContent(data)}</div>`;document.body.append(win);makeDraggable(win);taskButtonFor(name,win);win.addEventListener("pointerdown",()=>raise(win));win.querySelector('[data-window="min"]').addEventListener("click",()=>minimizeWindow(win));win.querySelector('[data-window="max"]').addEventListener("click",()=>{win.classList.toggle("maximized");win.querySelector('[data-window="max"]').title=win.classList.contains("maximized")?"还原":"最大化"});win.querySelector('[data-window="close"]').addEventListener("click",()=>closeWindow(win));win.addEventListener("click",e=>handleAppClick(e,win));win.addEventListener("input",e=>handleAppInput(e,win));win.addEventListener("change",e=>handleAppChange(e,win));win.addEventListener("keydown",e=>{if(data.kind==="calculator")handleCalculatorKeyboard(e,win);if(data.kind==="notepad"&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();toast("更改已自动保存")}});if(data.kind==="folder")initializeExplorer(win);if(data.kind==="settings")applySettings();if(data.kind==="notepad")refreshNotes(win);if(data.kind==="calculator")win._calculator={display:"0",stored:null,operator:null,fresh:true};toast(`${name} 已打开`);return win}
function makeDraggable(win){const bar=win.querySelector(".titlebar");let sx=0,sy=0,left=0,top=0,moving=false;bar.addEventListener("pointerdown",e=>{if(e.target.closest(".window-controls")||win.classList.contains("maximized"))return;moving=true;bar.classList.add("dragging");raise(win);const r=win.getBoundingClientRect();sx=e.clientX;sy=e.clientY;left=r.left;top=r.top;bar.setPointerCapture(e.pointerId)});bar.addEventListener("pointermove",e=>{if(!moving)return;const x=Math.max(0,Math.min(innerWidth-win.offsetWidth,left+e.clientX-sx)),y=Math.max(0,Math.min(innerHeight-65,top+e.clientY-sy));win.style.left=x+"px";win.style.top=y+"px";win.style.transform="none"});const stop=()=>{moving=false;bar.classList.remove("dragging")};bar.addEventListener("pointerup",stop);bar.addEventListener("pointercancel",stop);bar.addEventListener("dblclick",e=>{if(!e.target.closest(".window-controls"))win.classList.toggle("maximized")})}
const fileIcons={folder:"folder",file:"notepad"};
function initializeExplorer(win){win._explorer={location:"此电脑",back:[],forward:[],details:false};renderExplorer(win)}
function renderExplorer(win){const state=win._explorer,list=win.querySelector("[data-file-list]");if(!state||!list)return;const location=state.location,items=fileSystem[location]||[],query=win.querySelector("[data-explorer-search]").value.trim().toLowerCase();win.querySelector("[data-address]").textContent=`⌂　此电脑　›　${location}`;win.querySelectorAll(".explorer-nav [data-folder]").forEach(b=>b.classList.toggle("current",b.dataset.folder===location));list.classList.toggle("details-view",state.details);list.replaceChildren();const visible=items.filter(item=>item.name.toLowerCase().includes(query));if(!visible.length){const empty=document.createElement("div");empty.className="empty-folder";empty.textContent=query?"没有找到匹配的项目":"此文件夹为空";list.append(empty);return}visible.forEach(item=>{const button=document.createElement("button");button.className="folder folder-item";button.dataset.explorerItem=item.name;button.dataset.itemType=item.type;button.innerHTML=`${icon(item.type==="folder"?fileIcons.folder:fileIcons.file,39)}<span>${escapeHtml(item.name)}</span><small>${item.type==="folder"?"文件夹":"文本文件"}</small>`;button.addEventListener("dblclick",()=>openExplorerItem(win,item));button.addEventListener("contextmenu",e=>showContext(e,[["打开",()=>openExplorerItem(win,item)],["重命名",()=>renameExplorerItem(win,item)],["删除",()=>deleteExplorerItem(win,item)]]));list.append(button)})}
function navigateExplorer(win,location){const state=win._explorer;if(!state)return;if(state.location!==location){state.back.push(state.location);state.forward=[]}state.location=location;fileSystem[location] ||= [];renderExplorer(win)}
function openExplorerItem(win,item){if(item.type==="folder"){navigateExplorer(win,item.name);return}let note=notes.find(n=>n.name===item.name);if(!note){note={id:"file-"+Date.now(),name:item.name,text:item.content||"",updated:Date.now(),sourceLocation:win._explorer.location,sourceName:item.name};notes.push(note);saveNotes()}else{note.sourceLocation=win._explorer.location;note.sourceName=item.name}const noteWindow=openApp("记事本");if(noteWindow)selectNote(noteWindow,note.id)}
async function createExplorerItem(win,type){const location=win._explorer.location,name=await showSystemDialog({title:type==="folder"?"新建文件夹":"新建文本文件",message:`在“${location}”中创建新的${type==="folder"?"文件夹":"文本文件"}。`,value:type==="folder"?"新建文件夹":"新建文本文档.txt"});if(name===null)return;const clean=name.trim();if(!clean){toast("名称不能为空");return}if((fileSystem[location]||[]).some(item=>item.name.toLowerCase()===clean.toLowerCase())){toast("此位置已存在同名项目");return}const item={type,name:clean,content:""};fileSystem[location] ||= [];fileSystem[location].push(item);if(type==="folder")fileSystem[clean] ||= [];saveFileSystem();renderExplorer(win);if(type==="file")openExplorerItem(win,item)}
async function renameExplorerItem(win,item){const name=await showSystemDialog({title:"重命名",message:"输入此项目的新名称。",value:item.name});if(name===null)return;const clean=name.trim();if(!clean){toast("名称不能为空");return}if(fileSystem[win._explorer.location].some(other=>other!==item&&other.name.toLowerCase()===clean.toLowerCase())){toast("此位置已存在同名项目");return}const old=item.name;item.name=clean;if(item.type==="folder"&&fileSystem[old]){fileSystem[clean]=fileSystem[old];delete fileSystem[old]}const note=notes.find(n=>n.name===old);if(note){note.name=clean;saveNotes()}saveFileSystem();renderExplorer(win);toast("已重命名")}
async function deleteExplorerItem(win,item){if(!await showSystemDialog({title:"删除项目",message:`确定要删除“${item.name}”吗？此操作只影响模拟文件系统。`,input:false,confirmLabel:"删除"}))return;const location=win._explorer.location;fileSystem[location]=fileSystem[location].filter(other=>other!==item);if(item.type==="folder")delete fileSystem[item.name];saveFileSystem();renderExplorer(win);toast("项目已从模拟文件夹中删除")}
function setSettingsPage(win,page){const main=win.querySelector("[data-settings-main]");if(!main)return;main.innerHTML=settingsPageMarkup(page);win.querySelectorAll(".settings-nav [data-setting]").forEach(button=>button.classList.toggle("selected",button.dataset.setting===page));main.scrollTop=0}
function handleSettingsClick(e,win){const nav=e.target.closest("[data-setting]");if(nav){setSettingsPage(win,nav.dataset.setting);return}const target=e.target.closest("[data-setting-target]");if(target){setSettingsPage(win,target.dataset.settingTarget);return}const wallpaper=e.target.closest(".wallpaper-swatch[data-wallpaper]");if(wallpaper){settingsState.wallpaper=wallpaper.dataset.wallpaper;saveSettings();setSettingsPage(win,"个性化");return}const launch=e.target.closest("[data-launch]");if(launch){openApp(launch.dataset.launch);return}if(e.target.closest("[data-check-updates]")){settingsState.updatesChecked=true;saveSettings();setSettingsPage(win,"Windows 更新");toast("检查完成：此模拟桌面没有系统更新");return}if(e.target.closest("[data-save-profile]")){settingsState.profileName=win.querySelector('[data-setting-value="profileName"]').value.trim()||"本地用户";saveSettings();$("#startPanel .profile span:last-child").textContent=settingsState.profileName;setSettingsPage(win,"账户");toast("用户名已保存");return}}
function handleAppClick(e,win){if(win.dataset.name==="文件资源管理器"){const action=e.target.closest("[data-explorer-action]");if(action){const state=win._explorer;if(action.dataset.explorerAction==="new"){const r=action.getBoundingClientRect();showContext({clientX:r.left,clientY:r.bottom,preventDefault(){}},[["新建文件夹",()=>createExplorerItem(win,"folder")],["新建文本文件",()=>createExplorerItem(win,"file")]])}else if(action.dataset.explorerAction==="back"&&state.back.length){state.forward.push(state.location);state.location=state.back.pop();renderExplorer(win)}else if(action.dataset.explorerAction==="forward"&&state.forward.length){state.back.push(state.location);state.location=state.forward.pop();renderExplorer(win)}else if(action.dataset.explorerAction==="up"){navigateExplorer(win,state.location==="用户"?"本地磁盘 (C:)":"此电脑")}else if(action.dataset.explorerAction==="view"){state.details=!state.details;renderExplorer(win)}return}const folder=e.target.closest(".explorer-nav [data-folder]");if(folder){navigateExplorer(win,folder.dataset.folder);return}const item=e.target.closest("[data-explorer-item]");if(item){win.querySelectorAll(".folder-item").forEach(x=>x.classList.toggle("selected",x===item));return}}
if(win.dataset.name==="设置"){handleSettingsClick(e,win);return}
if(win.dataset.name==="记事本"){const tab=e.target.closest("[data-note-id]");if(tab){selectNote(win,tab.dataset.noteId);return}const action=e.target.closest("[data-note-action]");if(action)handleNoteAction(win,action.dataset.noteAction);return}
if(win.dataset.name==="计算器"){const key=e.target.closest("[data-calc]");if(key)calculate(key.dataset.calc,win);return}
const action=e.target.closest("[data-action]");if(action)toast(`${win.dataset.name}：本地模拟界面`)}
function handleAppInput(e,win){if(win.dataset.name==="文件资源管理器"&&e.target.matches("[data-explorer-search]"))renderExplorer(win);if(win.dataset.name==="记事本"&&e.target.matches(".note-editor")){const note=notes.find(n=>n.id===win.dataset.noteId);if(note){note.text=e.target.value;note.updated=Date.now();if(note.sourceLocation){const file=(fileSystem[note.sourceLocation]||[]).find(item=>item.name===note.sourceName);if(file)file.content=note.text;saveFileSystem()}saveNotes();updateNoteCount(win)}}}
function handleAppChange(e,win){if(win.dataset.name!=="设置")return;const input=e.target.closest("[data-setting-value]");if(!input)return;const key=input.dataset.settingValue;settingsState[key]=input.type==="checkbox"?input.checked:input.type==="range"?Number(input.value):input.value;saveSettings();if(key==="profileName")return;const page=win.querySelector(".settings-nav .selected")?.dataset.setting||"主页";setSettingsPage(win,page)}
function selectNote(win,id){const note=notes.find(n=>n.id===id);if(!note)return;win.dataset.noteId=id;win.querySelector(".note-editor").value=note.text;win.querySelectorAll("[data-note-id]").forEach(tab=>tab.classList.toggle("active",tab.dataset.noteId===id));win.querySelector(".note-title").textContent=note.name;updateNoteCount(win)}
function updateNoteCount(win){const editor=win.querySelector(".note-editor");const count=win.querySelector("[data-note-count]");if(editor&&count)count.textContent=String(editor.value.length)}
function refreshNotes(win){win.querySelector(".note-tabbar").innerHTML=notes.map(n=>`<button class="note-tab ${n.id===win.dataset.noteId?"active":""}" data-note-id="${escapeHtml(n.id)}">${escapeHtml(n.name)}</button>`).join("");if(!notes.some(n=>n.id===win.dataset.noteId))win.dataset.noteId=notes[0]?.id||"";selectNote(win,win.dataset.noteId)}
async function handleNoteAction(win,action){const current=notes.find(n=>n.id===win.dataset.noteId);if(action==="new"){const raw=await showSystemDialog({title:"新建笔记",message:"为新笔记输入一个名称。",value:"未命名.txt"});if(raw===null)return;const name=raw.trim()||"未命名.txt";const note={id:"note-"+Date.now(),name,text:"",updated:Date.now()};notes.unshift(note);saveNotes();refreshNotes(win);selectNote(win,note.id);win.querySelector(".note-editor").focus()}else if(action==="save"){if(current){current.text=win.querySelector(".note-editor").value;current.updated=Date.now();saveNotes();toast("更改已保存在此浏览器")}}else if(action==="delete"){if(current&&await showSystemDialog({title:"删除笔记",message:`确定要删除笔记“${current.name}”吗？`,input:false,confirmLabel:"删除"})){notes=notes.filter(n=>n.id!==current.id);if(!notes.length)notes.push({id:"welcome",name:"欢迎使用.txt",text:"",updated:Date.now()});saveNotes();refreshNotes(win)}}else if(action==="download"&&current){const blob=new Blob([win.querySelector(".note-editor").value],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download=current.name.endsWith(".txt")?current.name:`${current.name}.txt`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("已下载文本文件")}}
function calculate(key,win){const state=win._calculator,display=win.querySelector("[data-calc-display]");if(!state||!display)return;let value=Number(state.display);if(/^\d$/.test(key)){state.display=state.fresh||state.display==="0"?key:state.display+key;state.fresh=false}else if(key==="."){if(state.fresh){state.display="0.";state.fresh=false}else if(!state.display.includes("."))state.display+="."}else if(key==="C"||key==="CE"){state.display="0";state.stored=null;state.operator=null;state.fresh=true}else if(key==="⌫"){state.display=state.display.length>1?state.display.slice(0,-1):"0"}else if(key==="±"){state.display=String(-value)}else if(key==="％"){state.display=String(value/100)}else if(key==="√x"){state.display=value<0?"无效输入":String(Math.sqrt(value))}else if(key==="x²"){state.display=String(value*value)}else if(key==="1/x"){state.display=value===0?"无法除以零":String(1/value)}else if(["+","−","×","÷"].includes(key)){state.stored=value;state.operator=key;state.fresh=true}else if(key==="="&&state.operator&&state.stored!==null){const a=state.stored,b=value;const result=state.operator==="+"?a+b:state.operator==="−"?a-b:state.operator==="×"?a*b: b===0?null:a/b;state.display=result===null?"无法除以零":String(Number(result.toPrecision(12)));state.operator=null;state.stored=null;state.fresh=true}display.value=state.display}
function handleCalculatorKeyboard(e,win){const map={Enter:"=","*":"×","/":"÷","-":"−","+": "+",Backspace:"⌫",Escape:"C"};const key=map[e.key]||e.key;if(/^\d$/.test(key)||[".","=","+","−","×","÷","⌫","C"].includes(key)){e.preventDefault();calculate(key,win)}}
function showContext(e,items){e.preventDefault();const menu=$("#contextMenu");menu.replaceChildren();items.forEach(([label,action])=>{if(label==="|"){menu.append(document.createElement("hr"));return}const b=document.createElement("button");b.textContent=label;b.addEventListener("click",()=>{menu.classList.remove("open");action()});menu.append(b)});menu.style.left=Math.min(e.clientX,innerWidth-220)+"px";menu.classList.add("open");menu.style.top=Math.min(e.clientY,innerHeight-menu.offsetHeight-10)+"px"}
function buildQuickSettings(){const tiles=[["Wi-Fi","wifi","network"],["蓝牙","bluetooth","bluetooth"],["飞行模式","airplane","plane"],["夜间模式","nightLight","accessibility"]];const symbols={network:'<path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0m-9 3.5a5 5 0 0 1 5 0M12 19h.01"/>',bluetooth:'<path d="m7 7 10 10-5 5V2l5 5L7 17"/>',plane:'<path d="m2 16 8-5-6-7 2-1 9 6 5-3 2 1-4 5-1 8-2 1-2-7-8 4z"/>',accessibility:'<circle cx="12" cy="4" r="2"/><path d="M4 8h16m-8 0v6m0 0-4 7m4-7 4 7"/>'};tiles.forEach(([name,key,kind])=>{const b=document.createElement("button");b.className="quick-tile"+(settingsState[key]?" on":"");b.dataset.quickKey=key;b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${symbols[kind]}</svg><span>${name}<small>${settingsState[key]?"已开启":"已关闭"}</small></span>`;b.addEventListener("click",()=>{settingsState[key]=!settingsState[key];saveSettings();b.classList.toggle("on",settingsState[key]);b.querySelector("small").textContent=settingsState[key]?"已开启":"已关闭"});$("#quickGrid").append(b)});const sliders=$("#quickSettings").querySelectorAll('input[type="range"]');sliders[0].value=settingsState.volume;sliders[0].addEventListener("input",()=>{settingsState.volume=Number(sliders[0].value);localStorage.setItem("win11-settings",JSON.stringify(settingsState))});sliders[1].value=settingsState.brightness;sliders[1].addEventListener("input",()=>{settingsState.brightness=Number(sliders[1].value);applySettings();localStorage.setItem("win11-settings",JSON.stringify(settingsState))})}
function updateClock(){const now=new Date();$("#clockTime").textContent=new Intl.DateTimeFormat("zh-CN",{hour:"numeric",minute:"2-digit"}).format(now);$("#clockDate").textContent=new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"numeric",day:"numeric"}).format(now)}
function renderCalendar(){const now=new Date(),year=now.getFullYear(),month=now.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();$("#calendarMonth").textContent=`${year}年${month+1}月` ;$("#calendarFullDate").textContent=new Intl.DateTimeFormat("zh-CN",{weekday:"long",month:"long",day:"numeric"}).format(now);const grid=$("#calendarGrid");grid.replaceChildren();["日","一","二","三","四","五","六"].forEach(d=>{const s=document.createElement("span");s.className="weekday";s.textContent=d;grid.append(s)});for(let i=0;i<first;i++)grid.append(document.createElement("span"));for(let d=1;d<=days;d++){const s=document.createElement("span");s.textContent=d;if(d===now.getDate())s.className="today";grid.append(s)}}
buildDesktop();buildRecommended();buildQuickSettings();renderGrid();applySettings();updateClock();renderCalendar();setInterval(updateClock,15000);
$("#startButton").addEventListener("click",()=>togglePanel("startPanel"));$("#allAppsButton").addEventListener("click",()=>{allAppsMode=!allAppsMode;searchResultsMode=false;renderGrid($("#startSearch").value)});$("#startSearch").addEventListener("input",e=>{searchResultsMode=!!e.target.value.trim();allAppsMode=false;renderGrid(e.target.value)});$("#startSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){const first=apps.find(a=>a.name.toLowerCase().includes(e.target.value.trim().toLowerCase()));if(first)openApp(first.name)}});$("#moreButton").addEventListener("click",()=>toast("此处显示最近使用的应用和文件"));$("#powerButton").addEventListener("click",()=>toast("电源选项：睡眠 · 关机 · 重启（模拟）"));$("#searchButton").addEventListener("click",()=>{closePanels("startPanel");$("#startPanel").classList.add("open");$("#startSearch").value="";searchResultsMode=true;allAppsMode=false;renderGrid();$("#startHeading").textContent="搜索应用";setTimeout(()=>$("#startSearch").focus(),60)});$("#widgetsButton").addEventListener("click",()=>$("#widgets").classList.toggle("open"));$("#chatButton").addEventListener("click",()=>toast("聊天和会议：本地演示入口"));$("#networkButton").addEventListener("click",()=>togglePanel("quickSettings"));$("#soundButton").addEventListener("click",()=>togglePanel("quickSettings"));$("#batteryButton").addEventListener("click",()=>togglePanel("quickSettings"));$("#trayCaret").addEventListener("click",()=>togglePanel("quickSettings"));$("#notificationButton").addEventListener("click",()=>togglePanel("notifications"));$("#clockButton").addEventListener("click",()=>togglePanel("calendar"));$("#clearNotifications").addEventListener("click",()=>{$("#notifications").querySelectorAll(".notification-card").forEach(n=>n.remove());toast("通知已清除")});
$("#desktop").addEventListener("contextmenu",e=>{if(e.target.closest(".desktop-icon"))return;showContext(e,[["查看",()=>toast("桌面图标：中等")],["排序方式　›",()=>toast("按名称排列")],["刷新",()=>toast("桌面已刷新")],["|"],["新建　›",()=>toast("新建文件夹（模拟）")],["|"],["显示设置",()=>openApp("设置")],["个性化",()=>openApp("设置")]])});
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#contextMenu"))$("#contextMenu").classList.remove("open");if(!e.target.closest("#widgets,#widgetsButton")&&$("#widgets").classList.contains("open"))$("#widgets").classList.remove("open");if(!e.target.closest("#startPanel,#startButton,#searchButton")&&$("#startPanel").classList.contains("open"))$("#startPanel").classList.remove("open");if(!e.target.closest("#quickSettings,#networkButton,#soundButton,#batteryButton,#trayCaret")&&$("#quickSettings").classList.contains("open"))$("#quickSettings").classList.remove("open");if(!e.target.closest("#notifications,#notificationButton")&&$("#notifications").classList.contains("open"))$("#notifications").classList.remove("open");if(!e.target.closest("#calendar,#clockButton")&&$("#calendar").classList.contains("open"))$("#calendar").classList.remove("open")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePanels();$("#widgets").classList.remove("open")}if(e.key==="Meta"||e.key==="Escape"&&$("#startPanel").classList.contains("open"))$("#startPanel").classList.remove("open")});
document.addEventListener("contextmenu",e=>{if(e.target.closest(".desktop-icon"))return;if(!e.target.closest("#desktop"))e.preventDefault()});
